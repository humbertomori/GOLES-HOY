name: GOLES HOY - Actualizar pronosticos
on:
  schedule:
    - cron: '0 10,20 * * *'
  workflow_dispatch:
   
    
  
permissions:
  contents: write
concurrency:
  group: goles-hoy-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ejecutar pruebas antes de actualizar
        run: python -m unittest discover -s tests -v
      - name: Consultar fuente disponible y calcular pronosticos
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          MAX_API_CALLS: '44'
        run: python engine/update.py
      - name: Publicar datos sin exponer API key
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/history.json data/source_health.json
          if ! git diff --cached --quiet; then git commit -m 'Actualizar GOLES HOY'; git push; fi
