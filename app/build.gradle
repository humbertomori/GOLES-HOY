plugins { id 'com.android.application' }
android {
    namespace 'com.laroska.golesempates'
    compileSdk 35
    defaultConfig {
        applicationId 'com.laroska.goleshoy'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.2'
        buildConfigField 'String', 'EMPATES_SERVER_URL', '"' + (project.findProperty('empatesServerUrl') ?: '').toString() + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
